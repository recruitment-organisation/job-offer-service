spring:
  application:
    name: job-offer-service
  datasource:
    url: ${JOB_OFFER_DB_URL:jdbc:postgresql://localhost:5432/job_offer_db}
    username: ${JOB_OFFER_DB_USERNAME:admin}
    password: ${JOB_OFFER_DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  cloud:
    config:
      enabled: true
      label: main

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer



server:
  port: 8096


eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

outbox:
  publisher:
    fixed-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:1000}

